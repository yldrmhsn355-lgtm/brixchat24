name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: brixchat,
            POSTGRES_USER: brixchat,
            POSTGRES_PASSWORD: brixchat,
          }
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U brixchat" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6381:6379"]
    env:
      DATABASE_URL: postgresql://brixchat:brixchat@localhost:5434/brixchat
      REDIS_URL: redis://localhost:6381
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:check
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm architecture:check
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm security:secrets && pnpm security:rbac && pnpm security:tenant-isolation
      - run: pnpm security:audit && pnpm security:sbom && pnpm security:licenses
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-evidence, path: artifacts }
